name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  # Cancel previous runs for the same PR
  # Don't cancel successive pushes to main
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    # Pinned (not windows-latest) so a runner image bump can't silently change the build environment.
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v7

      # Extract dotnet SDK version from the csproj's TargetFramework
      - id: csproj
        shell: pwsh
        run: |
          $csproj = [xml](Get-Content Unload/Unload.csproj)
          $targetFramework = $csproj.SelectSingleNode('//TargetFramework').InnerText
          if ($targetFramework -notmatch '^net(\d+\.\d+)') { throw "Unexpected TargetFramework '$targetFramework'" }
          "dotnet-version=$($Matches[1]).x" >> $env:GITHUB_OUTPUT

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ steps.csproj.outputs.dotnet-version }}

      # Fail on known vulnerable packages, any severity (NuGetAudit runs during restore)
      - run: dotnet restore -warnaserror:NU1901,NU1902,NU1903,NU1904

      # Mark CI builds as prereleases in the window title (1.3.0-debug.42+<sha>)
      - run: dotnet build --no-restore --configuration Debug --version-suffix debug.${{ github.run_number }}

      - run: dotnet format --verify-no-changes --no-restore

      - uses: actions/upload-artifact@v7
        with:
          name: Unload-debug.${{ github.run_number }}
          path: Unload/bin/Debug/net10.0-windows/
          if-no-files-found: error
